# Local environment with Docker.
#   docker compose up -d          -> MySQL + API (http://localhost:4000/api)
#   docker compose up -d mysql    -> MySQL only (run the API with "npm run dev")
# The schema and seed run automatically the first time the volume is created.
# To start over from scratch: docker compose down -v && docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: orderflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orderflow
      MYSQL_USER: orderflow
      MYSQL_PASSWORD: orderflow
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    container_name: orderflow-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: orderflow
      DB_PASSWORD: orderflow
      DB_NAME: orderflow
      # Local only. Use a long random value in any shared or public environment.
      JWT_SECRET: local_docker_secret_change_me
    ports:
      - "4000:4000"

volumes:
  mysql_data:
